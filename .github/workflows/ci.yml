name: Factory checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: af_migrator
          POSTGRES_PASSWORD: synthetic-local-migration-only
          POSTGRES_DB: agentic_factory_local
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U af_migrator -d agentic_factory_local"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      FACTORY_MIGRATION_URL: postgres://af_migrator:synthetic-local-migration-only@127.0.0.1:55432/agentic_factory_local
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run deps:patch
      - run: npm run deps:check
      - run: npm run test:deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:setup-local
      - run: npm run db:setup-telegram
      - run: npm run db:setup-slack
      - run: npm run db:setup-queue
      - run: npm run test:compatibility
      - run: npm run test:state
      - run: npm run test:queue
      - run: npm run test:intake
      - run: npm run test:telegram
      - run: npm run test:slack
      - run: npm run test:simulations
      - run: node dist/cli/index.js --help
      - run: node dist/cli/index.js validate fixtures/software-general.json
      - run: node dist/cli/index.js validate fixtures/ml-research.json

  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AF_SANDBOX_TEST_ROOT: /tmp/af007-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TMPDIR: /tmp/af007-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AF_DOCKER_SOCKET: /var/run/docker.sock
      AF_SANDBOX_IMAGE: python@sha256:98ce6fb13b3803744fbca11434f00818f1e300e4e48a4f204e07b2c928b6218e
    steps:
      - run: mkdir -m 700 "$AF_SANDBOX_TEST_ROOT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run deps:patch
      - run: npm run deps:check
      - run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_WORKSPACE bash scripts/provision-sandbox-ci.sh
      - run: npm run build
      - run: npm run test:sandbox-tools
      - run: npm run sandbox:image
      - run: npm run test:sandbox
      - name: Clean sandbox test resources
        if: always()
        run: python3 scripts/cleanup-sandbox-ci.py
