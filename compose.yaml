name: agentic-factory-local
services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: af_migrator
      POSTGRES_PASSWORD: synthetic-local-migration-only
      POSTGRES_DB: agentic_factory_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U af_migrator -d agentic_factory_local"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  database:
